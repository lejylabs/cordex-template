[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
cordex = "0.2.4"
mimalloc = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
cordex-test = "0.2.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
# Keep panic = "unwind" so cordex's shard panic guard can recover a single shard.
panic = "unwind"

# Optimize the serde-heavy model crate for size without slowing down gateway/http.
[profile.release.package.cordex-model]
opt-level = "s"
